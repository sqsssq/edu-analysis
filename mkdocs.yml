site_name: Interpretable Learning Energy Framework
site_description: Interpretable pairwise maximum-entropy energy models for structured data
site_url: https://sqsssq.github.io/edu-analysis/docs/
repo_url: https://github.com/sqsssq/edu-analysis
repo_name: sqsssq/edu-analysis
docs_dir: docs
site_dir: site/docs
exclude_docs: |
  domain/
  harness/
  meta/
  prd/
  tasks/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - tables

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Core concepts: guide/core-concepts.md
      - Methods: guide/methods.md
      - Parameters: guide/parameters.md
      - Fit and inspect: guide/fit-and-inspect.md
      - Continuous models: guide/continuous-models.md
      - Visualizations: guide/visualizations.md
      - Save and reload: guide/save-and-reload.md
  - Reproduction:
      - PISA 2018: reproduction/PISA_2018_DATA_GUIDE.md
      - PISA 2022: reproduction/PISA_2022_DATA_GUIDE.md
      - Benchmark contract: reproduction/PISA_BENCHMARK_CONTRACT.md
  - API Reference:
      - Overview: API.md
      - Python API: api-reference.md
      - Core model: api/core.md
      - Continuous model: api/continuous.md
      - Data and results: api/data-and-results.md
      - Adapters and managers: api/adapters.md
      - PISA and visualization: api/integrations.md
  - Research notes:
      - Design: design.md
      - Limitations: limitations.md
