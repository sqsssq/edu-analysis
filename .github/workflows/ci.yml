name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Run strict project verification
        run: bash scripts/verify.sh --strict-instance

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Check Python project when present
        shell: bash
        run: |
          python --version
          if [[ -f pyproject.toml || -f setup.py || -f setup.cfg ]]; then
            python -m pip install --upgrade pip
            if [[ -f pyproject.toml ]]; then
              if [[ -f uv.lock ]]; then
                python -m pip install uv==0.12.14
                uv lock --check
                uv export --locked --extra dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/locked-requirements.txt"
                python -m pip install -r "$RUNNER_TEMP/locked-requirements.txt"
                python -m pip install -e . --no-deps
              else
                python -m pip install -e ".[dev]"
              fi
            else
              python -m pip install -e .
            fi
            if [[ -d tests ]]; then python -m pytest; fi
            if command -v ruff >/dev/null 2>&1; then ruff check .; fi
            if command -v mypy >/dev/null 2>&1; then mypy learning_energy_model; fi
            if [[ -f pyproject.toml ]]; then python -m build; fi
            if [[ -f pyproject.toml ]]; then
              wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
              wheel_smoke_dir="$RUNNER_TEMP/wheel-smoke"
              if unzip -Z1 "$wheel_path" | grep -E '(^|/)\.DS_Store$' >/dev/null; then
                echo "wheel contains an unwanted .DS_Store entry"
                exit 1
              fi
              python -m pip install --no-deps --target "$wheel_smoke_dir" "$wheel_path"
              (cd "$RUNNER_TEMP" && PYTHONPATH="$wheel_smoke_dir" python -c "import numpy as np; from learning_energy_model import DataConfig, LearningModel; model=LearningModel(DataConfig(target_name='y'), max_epochs=2); model.fit_table({'x':[0.,1.,0.,1.], 'y':[0.,1.,1.,0.]}, feature_names=('x',)); assert model.predict({'x':[0.,1.]}).probabilities.shape == (2,); print('wheel training smoke succeeded')")
            fi
            if [[ -f pyproject.toml ]]; then
              learning-energy-model --help >/dev/null
              python -m learning_energy_model --help >/dev/null
            fi
          else
            echo "No Python package metadata yet; Stage 0 harness checks remain authoritative."
          fi
      - name: Check optional PISA dependencies
        if: matrix.python-version == '3.12'
        run: |
          if [[ -f uv.lock ]]; then
            uv export --locked --extra pisa --no-emit-project --format requirements-txt > "$RUNNER_TEMP/locked-pisa-requirements.txt"
            python -m pip install -r "$RUNNER_TEMP/locked-pisa-requirements.txt"
            python -m pip install -e . --no-deps
          else
            python -m pip install -e ".[pisa]"
          fi
          python -c "import pandas, pyreadstat; print('PISA optional dependencies import successfully')"
