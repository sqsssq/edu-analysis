[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interpretable-learning-energy-model"
version = "0.1.0a1"
description = "Interpretable pairwise maximum-entropy energy models for structured data"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
authors = [{ name = "Qing Shi" }]
dependencies = [
  "numpy>=1.24",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
]
pisa = [
  "pandas>=2.0",
  "pyreadstat>=1.2",
]

[tool.setuptools.packages.find]
include = ["learning_energy_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
