[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interpretable-learning-energy-model"
version = "0.1.0a1"
description = "Interpretable pairwise maximum-entropy energy models for structured data"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
authors = [{ name = "Qing Shi" }]
keywords = ["maximum-entropy", "energy-model", "PISA", "interpretability", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "torch>=2.2,<3",
]

[project.urls]
Homepage = "https://github.com/sqsssq/edu-analysis"
Repository = "https://github.com/sqsssq/edu-analysis"
Documentation = "https://github.com/sqsssq/edu-analysis#readme"
Issues = "https://github.com/sqsssq/edu-analysis/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
]
pisa = [
  "pandas>=2.0",
  "pyreadstat>=1.2",
]

[project.scripts]
learning-energy-model = "learning_energy_model.cli:main"

[tool.setuptools.packages.find]
include = ["learning_energy_model*"]

[tool.setuptools.package-data]
learning_energy_model = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
